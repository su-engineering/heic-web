name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:package

      # The parser and the fuzzer need no browser at all, and they are where the
      # security-relevant behaviour lives.
      - run: pnpm test:unit

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:package
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      - name: Smoke-test the comparison benchmark
        run: node tools/benchmark.mjs --iterations 1 --cold 1 --output benchmark-results/smoke.json

      # Headless Linux generally lacks platform HEVC decoding. Some WebKit
      # builds accept limited HEVC profiles. Tests check each fixture config;
      # software fallback tests run unconditionally on all three engines.
      #
      # A green badge on this workflow does NOT mean the primary decode path is
      # tested. That needs a real device matrix — see the chrome-hevc project in
      # playwright.config.ts, run locally with:
      #   HEIC_CHROME="/path/to/chrome" pnpm test:browser --project=chrome-hevc
      - name: Note on coverage
        run: |
          echo "::notice::Platform HEVC needs device testing. CI covers parser/WASM paths and any fixture-specific WebCodecs configurations accepted by its browsers."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
